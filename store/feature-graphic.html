<!doctype html><html><head><meta charset="utf-8">
<link href="../assets/fonts/" rel="preload">
<style>
@font-face { font-family: DM; src: url("../assets/fonts/DMSans-Black.ttf"); font-weight: 900; }
@font-face { font-family: DM; src: url("../assets/fonts/DMSans-Bold.ttf"); font-weight: 700; }
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
body{background:linear-gradient(135deg,#F6B544 0%,#F4A221 55%,#E8901A 100%);font-family:DM,system-ui,sans-serif;position:relative}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.18) 2px,transparent 2.5px);background-size:34px 34px}
.text{position:absolute;left:70px;top:110px;width:560px}
h1{margin:0;color:#fff;font-size:104px;font-weight:900;letter-spacing:-2px;text-shadow:0 6px 0 #D9860F}
p{margin:18px 0 0;color:#5C3A21;font-size:38px;font-weight:700;line-height:1.2}
.pill{display:inline-block;margin-top:26px;background:#D93B27;color:#fff;font-weight:900;font-size:24px;padding:12px 26px;border-radius:999px;box-shadow:0 6px 0 #A8301F}
img{position:absolute;right:60px;top:40px;width:400px;height:400px;object-fit:contain;filter:drop-shadow(0 12px 0 rgba(92,58,33,.18))}
</style></head><body><div class="dots"></div>
<div class="text"><h1>Voxlab</h1><p>Hablá en público con confianza</p><span class="pill">Lecciones + minijuegos con IA</span></div>
<img src="voxi.png"></body></html>
